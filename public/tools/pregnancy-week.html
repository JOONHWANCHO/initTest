    </div>

    <div id="lmpInput">
      <div class="input-group">
        <label data-i18n="pregnancy-week.first_day_last_period">마지막 생리 첫 날</label>
        <input type="date" id="lmpDate" max="">
      </div>
    </div>
    <div id="ultraInput" class="hidden">
      <div class="input-row">
        <div class="input-group">
          <label data-i18n="pregnancy-week.ultrasound_date">초음파 날짜</label>
          <input type="date" id="ultraDate" max="">
        </div>
        <div class="input-group">
          <label data-i18n="pregnancy-week.weeks_that_time">그 때 주수 (주)</label>
          <input type="number" id="ultraWeek" placeholder="예: 8" min="4" max="40" data-i18n-attr="placeholder:pregnancy-week.e_g_8">
        </div>
      </div>
    </div>
    <button class="calc-btn" onclick="calculate()" data-i18n="pregnancy-week.calculate_weeks">🤰 주수 계산하기</button>
  </div>

      <div class="result-box">
        <div class="result-label" data-i18n="pregnancy-week.current_week_pregnancy">현재 임신 주수</div>
        <div class="week-num" id="currentWeek">—</div>
        <div class="week-sub" id="currentDays"></div>
      </div>
      <div class="result-box amber">
        <div class="result-label" data-i18n="pregnancy-week.due_date">출산 예정일</div>
        <div style="font-size:1.2rem;font-weight:900;color:#7A5710;" id="dueDate">—</div>
        <div class="week-sub" id="dueDays"></div>
      </div>
    </div>

    <div class="section-gap">
      <h2 class="block-title" data-i18n="pregnancy-week.pregnancy_progress">임신 진행 단계</h2>
      <div class="card">
        <div class="trimester-bar">
          <div class="t1"></div><div class="t2"></div><div class="t3"></div>
        </div>
        <div class="t-labels" data-i18n-html="pregnancy-week.1st_trimester_12_wks_2nd">

          <span>2삼분기<br>(13~27주)</span>
          <span>3삼분기<br>(28주~)</span>
        </div>
        <div id="trimesterLabel" style="margin-top:.75rem;font-size:13px;color:var(--text-muted);"></div>
      </div>
    </div>

    <div class="section-gap">
      <h2 class="block-title" data-i18n="pregnancy-week.baby_this_week">현재 주차 태아</h2>

        <div class="fetal-size" id="fetalInfo"></div>
        <div style="margin-top:.875rem;font-size:13px;color:var(--text-muted);line-height:1.65;" id="weeklyDesc"></div>
      </div>
    </div>

    <div class="section-gap card">
      <h2 class="block-title" data-i18n="pregnancy-week.key_pregnancy_milestones">임신 주요 마일스톤</h2>
