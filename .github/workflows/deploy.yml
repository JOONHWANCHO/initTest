name: Deploy (GitHub Pages)

# 배포 대상은 저장소 루트가 아니라 public/ 폴더입니다.
# 저장소 Settings → Pages → Build and deployment → Source 를 "GitHub Actions" 로 바꿔야 동작합니다.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: 배포 전 정합성 검사 (실패하면 배포하지 않음)
        run: npm run check
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
